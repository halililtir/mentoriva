<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bağlantı yok · Mentoriva</title>
  <style>
    :root { --bg: #f4f8fb; --fg: #14181f; --muted: #5b6573; --accent: #0e7c86; }
    @media (prefers-color-scheme: dark) { :root { --bg: #070b14; --fg: #f0f2f5; --muted: #98a2b3; --accent: #33d4dc; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    h1 { margin: 0 0 10px; font-family: Georgia, serif; font-weight: 400; font-size: 28px; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.6; max-width: 320px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 14px; background: var(--accent); color: var(--bg); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Şu an bağlantı yok</h1>
    <p>Mentorlar internete ihtiyaç duyuyor. Bağlantın gelince kaldığın yerden devam edebilirsin.</p>
    <a href="/">Yeniden dene</a>
  </main>
</body>
</html>
